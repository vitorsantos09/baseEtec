<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 1</title>
</head>
<body>
    Nome : <input type="text" id="nome">
    <button onclick="Mensagem()">Mensagem</button>
    <div id="mensagem"></div>
    <script>
            function Mensagem(){
                var nome = document.getElementById("nome").value;
            document.getElementById("mensagem").innerHTML="Bem vinde "+nome+""; 
        }
    </script>
</body>
</html>
